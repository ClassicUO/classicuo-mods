name: index
on:
  push:
    branches: [main]
    paths: ["mods/**", "scripts/build_index.py"]
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_index.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.json
          git diff --cached --quiet || git commit -m "index: regenerate" && git push
